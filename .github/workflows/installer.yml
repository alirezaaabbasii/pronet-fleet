name: Single-host installer validation
on:
  pull_request:
    paths:
      - 'get.sh'
      - 'dist/engines/**'
      - 'tools/test-get-installer.py'
      - '.github/workflows/installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n get.sh
      - name: Build verified fixtures using only the raw host
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/alirezaaabbasii/pronet-fleet/main/dist/pronet-fleet-0.3.12.zip -o "$RUNNER_TEMP/base.zip"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);base=root/'base.zip'
          assert hashlib.sha256(base.read_bytes()).hexdigest()=='3f1c4483c41c1f288281dabb789289888e043a9132e1d99f814929e55ba2fb37'
          with zipfile.ZipFile(base) as z:z.extractall(root)
          source=root/'pronet-fleet-0.3.19';(root/'pronet-fleet-0.3.12').rename(source)
          with zipfile.ZipFile('dist/pronet-fleet-0.3.19-update.zip') as z:z.extractall(root)
          locked=json.loads((source/'assets.lock.json').read_text())
          for engine in ('paqet','backhaul','parsa-spoof'):
              for asset in locked[engine]['assets'].values():
                  path=pathlib.Path('dist/engines')/asset['sha256']/asset['name']
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==asset['sha256']
                  shutil.copyfile(path,source/'vendor'/asset['name'])
          PY
      - name: Fresh install, upgrade, join and corrupted download with Releases unavailable
        run: python3 tools/test-get-installer.py --source "$RUNNER_TEMP/pronet-fleet-0.3.19" --base "$RUNNER_TEMP/base.zip"
