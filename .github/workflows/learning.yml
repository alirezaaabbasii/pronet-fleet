name: Carrier memory and advanced consent validation
on:
  pull_request:
    paths:
      - 'updates/0.3.17/pronet/**'
      - 'updates/0.3.17/tests/**'
      - 'updates/0.3.17/assets.lock.json'
      - 'tools/assemble-learning-ci.py'
      - '.github/workflows/learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-carriers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: paqet, test_only: false}
          - {profile: backhaul-tcp, test_only: false}
          - {profile: backhaul-tcpmux, test_only: false}
          - {profile: parsa-spoof, test_only: false}
          - {profile: parsa-spoof, test_only: true}
          - {profile: frp-quic, advanced: true}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install WireGuard prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
      - name: Assemble immutable source and verified engines
        run: python3 tools/assemble-learning-ci.py "$RUNNER_TEMP/pronet-ci"
      - name: Unit regressions
        if: matrix.profile == 'backhaul-tcp'
        run: |
          cd "$RUNNER_TEMP/pronet-ci/pronet-fleet-0.3.12"
          python3 -m unittest discover -s tests
      - name: Two-agent setup, data integrity, half-close, crash recovery and cleanup
        run: |
          cd "$RUNNER_TEMP/pronet-ci/pronet-fleet-0.3.12"
          sudo -E python3 tests/linux_integration.py --profiles ${{ matrix.profile }} ${{ matrix.test_only && '--test-only' || '' }} ${{ matrix.advanced && '--advanced-flow' || '' }} --timeout 720 --output "$RUNNER_TEMP/${{ matrix.profile }}.json"
